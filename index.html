<title>Toad House POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: table floor grid → order screen (menu left, check right). Print area renders 80mm thermal tickets. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1f2420; --muted:#6b716a; --line:#dcd8cf;
  --toad:#2f6b3f; --toad-ink:#ffffff; --busy:#c8792a; --sent:#2f6b3f; --danger:#b23a2e;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161a17; --panel:#20251f; --ink:#ecefe9; --muted:#9aa196; --line:#343b33;
  --toad:#4e9a62; --toad-ink:#0e140f; --busy:#e0954a; --sent:#6fbf83; --danger:#e0685b; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--toad);outline-offset:2px}
button.primary{background:var(--toad);color:var(--toad-ink);border-color:var(--toad);font-weight:700}
button.warn{background:var(--busy);color:#1b1206;border-color:var(--busy);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header.top h1 small{font-weight:500;color:var(--muted);font-size:13px}
.spacer{flex:1}
.clock{color:var(--muted)}
.sync{font-size:13px;font-weight:700}
.sync.on{color:var(--sent)} .sync.off{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}

/* floor */
#floor{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.tbl{min-height:110px;text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px;border-width:2px}
.tbl .name{font-size:20px;font-weight:900}
.tbl .meta{font-size:13px;color:var(--muted)}
.tbl.busy{border-color:var(--busy)}
.tbl.busy .name{color:var(--busy)}
.tbl .amt{margin-top:auto;font-weight:600}
.sect{grid-column:1/-1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* order screen */
#order{display:grid;grid-template-columns:1fr 380px;height:calc(100dvh - 61px - env(safe-area-inset-top,0px))}
.acts{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))!important}
@media (max-width:1100px){#order{grid-template-columns:1fr 330px}}
#menuSide{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
#cats button{white-space:nowrap}
#cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#items{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;align-content:start}
.mi{text-align:left;min-height:92px;display:flex;flex-direction:column;gap:6px}
.mi b{font-size:16px}
.mi span{color:var(--muted);font-size:13px}
.en{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
#cats button{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
#cats button.on .en{color:inherit;opacity:.75}
.mi .en{margin-top:-4px}
#check{display:flex;flex-direction:column;background:var(--panel);min-width:0}
#check .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
#check .hd h2{margin:0;font-size:22px;font-weight:900}
#lines{flex:1;overflow-y:auto;padding:8px 0}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 16px;border-bottom:1px dashed var(--line)}
.ln .nm{font-weight:700;min-width:0}
.ln .pr{text-align:right}
.ln .ctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln .ctl button{padding:4px 12px;border-radius:8px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;font-weight:700;letter-spacing:.03em}
.pill.new{color:var(--busy)} .pill.sent{color:var(--sent)}
.pill.svc{color:#2E6B45;margin-right:6px} .ctl button.svcOn{border-color:#2E6B45;color:#2E6B45} s.was{opacity:.5;font-weight:400}
.note{grid-column:1/-1;color:var(--busy);font-size:13px}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
.tot{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px}
.tot .big{font-size:22px;font-weight:900}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.acts .wide{grid-column:1/-1;padding:14px;font-size:17px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--panel);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:19px}
.box textarea,.box input{width:100%;font:inherit;font-family:var(--mono);font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.box textarea{min-height:300px}
.box .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
table.rep{width:100%;border-collapse:collapse}
table.rep td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.rep td:last-child{text-align:right}
table.rep td.q{text-align:right;width:56px;color:var(--muted)}
table.rep tr.cat td{font-weight:700;background:var(--bg);padding-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg button{padding:6px 12px;border-radius:8px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:20px}
.box h4{margin:6px 0 0;font-size:15px}
.sub{font-size:12px;color:var(--muted)}

@media (max-width:700px){
  #order{grid-template-columns:1fr;height:auto}
  #menuSide{border-right:0}
  #items{max-height:none}
}

/* print: only the ticket, sized for 80mm thermal paper */
#printArea{display:none}
@media print{
  @page{size:80mm auto;margin:3mm}
  body{background:#fff;color:#000}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block;width:72mm;font-family:var(--mono);font-size:12px;color:#000}
  .tk{position:relative}
  .tk .wm{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);opacity:.12;z-index:0;pointer-events:none}
  .tk .wm svg{width:62mm!important;height:62mm!important}
  .tk > *:not(.wm){position:relative;z-index:1}
  .tk h1{font-family:var(--sans);font-size:20px;margin:0;text-align:center}
  .tk .c{text-align:center}
  .tk hr{border:0;border-top:1px dashed #000;margin:6px 0}
  .tk .r{display:flex;justify-content:space-between;gap:6px}
  .tk .kit{font-family:var(--sans);font-size:30px;font-weight:900;line-height:1.2;margin:10px 0 2px}
  .tk .kn{font-family:var(--sans);font-size:19px;font-weight:700;margin:0 0 4px 22px}
  .tk .big{font-size:40px;font-weight:900;text-align:center;font-family:var(--sans)}
  .tk .b{font-weight:700;font-size:14px}
}

<script>
const STORE="toadhouse-pos-v2";
const DEFAULT_MENU=`# 형식: 카테고리 | 메뉴 이름 | 가격 | 영문 이름(영수증용, 선택)

식사류 | 된장찌개 (2인) | 40 | Soybean Paste Soup (2)
식사류 | 동태매운탕 | 45 | Spicy Pollack Soup
식사류 | 계란찜 | 7 | Steamed Eggs
식사류 | 볶음밥 (1인) | 10 | Fried Rice (1)
식사류 | 볶음밥 (2인) | 16 | Fried Rice (2)
소주/전통주 | 새로 | 13 | Soju Saero
소주/전통주 | 처음처럼 | 13 | Soju Chum Churum
소주/전통주 | 참이슬 | 13 | Soju Chamisul
소주/전통주 | 이즈백 | 13 | Soju Is Back
소주/전통주 | 국순당 생막걸리 | 13 | Draft Rice Wine
소주/전통주 | 백세주 | 17 | Bekseju
소주/전통주 | 명작 복분자 | 19 | Bokbunja
맥주 | 크러쉬 | 10 | Beer Krush

맥주 | 카스 | 10 | Beer Cass
맥주 | 테라 | 10 | Beer Terra
음료 | 코카콜라 | 3 | Coke

/* ===== Firebase 설정: 가게 Firebase 프로젝트 값으로 채우면 기기 간 공유 모드가 켜집니다 ===== */
const FB_CONFIG = {
  apiKey: "AIzaSyD6JQFDQV9o18SDwRksq6nTn2JemGaxGio",
  authDomain: "toadhouse-pops.firebaseapp.com",
  databaseURL: "https://toadhouse-pops-default-rtdb.firebaseio.com",
  projectId: "toadhouse-pops",
  storageBucket: "toadhouse-pops.firebasestorage.app",
  messagingSenderId: "411440382673",
  appId: "1:411440382673:web:e5106cd6851b01be8bfbf0"
};
const SHOP_EMAIL = "toadhousela@gmail.com";

const CLOUD = !!FB_CONFIG && typeof firebase !== "undefined";
let S = load();
function defaults(d){
  d.settings=Object.assign({tax:10.25,tables:12,togo:3,nextNo:1001,name:"Toad House",addr:"4503 Beverly Blvd, Los Angeles, CA 90004",phone:"(323) 460-7037"},d.settings||{});
  if(d.settings.tax===9.75)d.settings.tax=10.25;
  d.menuText=d.menuText||DEFAULT_MENU;
  d.tables=d.tables||{};
  d.sales=d.sales||[];
  return d;
}
function load(){let d=null; try{d=JSON.parse(localStorage.getItem(STORE))}catch(e){} return defaults(d||{})}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
const clean=o=>JSON.parse(JSON.stringify(o));
function normTable(t){ if(!t)return t; t.items=(t.items||[]).map(x=>Object.assign({note:"",en:"",sent:0},x)); return t; }

/* ---- storage layer: local (this device only) or cloud (shared) ---- */
let db=null;
function commitTable(id){
  const t=S.tables[id];
  const empty=!t||!t.items.length;
  if(empty)delete S.tables[id];
  if(CLOUD&&db){ db.ref("pos/tables/"+id).set(empty?null:clean(t)); }
  else saveLocal();
}
function commitSettings(){
  if(CLOUD&&db){ db.ref("pos/settings").set(clean(S.settings)); db.ref("pos/menuText").set(S.menuText); }
  else saveLocal();
}
async function nextReceiptNo(){
  if(CLOUD&&db){
    const r=await db.ref("pos/nextNo").transaction(n=>(n||S.settings.nextNo||1001)+1);
    return r.snapshot.val()-1;
  }
  const n=S.settings.nextNo++; saveLocal(); return n;
}
function addSale(sale){
  if(CLOUD&&db){ db.ref("pos/sales").push(clean(sale)); }
  else { S.sales.push(sale); saveLocal(); }
}
async function salesBetween(a,b){
  if(CLOUD&&db){
    const snap=await db.ref("pos/sales").orderByChild("time").startAt(a).endAt(b-1).once("value");
    const out=[]; snap.forEach(c=>{out.push(c.val())}); return out;
  }
  return S.sales.filter(x=>x.time>=a&&x.time<b);
}
async function salesSince(ts){
  if(CLOUD&&db){
    const snap=await db.ref("pos/sales").orderByChild("time").startAt(ts).once("value");
    const out=[]; snap.forEach(c=>{out.push(c.val())}); return out;
  }
  return S.sales.filter(x=>x.time>=ts);
}
function refresh(){
  if(cur){ if(!S.tables[cur])S.tables[cur]={items:[],opened:Date.now()}; renderOrder(); } else renderFloor();
}
function setStatus(on){
  const el=$("sync"); if(!el)return;
  el.hidden=!CLOUD; el.className="sync "+(on?"on":"off"); el.textContent=on?"● 공유 연결됨":"● 오프라인";
}
function startCloud(){
  firebase.initializeApp(FB_CONFIG);
  db=firebase.database();
  setStatus(false);
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){ loginScreen(); return; }
    closeModal();
    db.ref(".info/connected").on("value",s=>setStatus(!!s.val()));
    db.ref("pos/printer/lastSeen").on("value",s=>{printerSeen=s.val()||0; printerStatus();});
    // first device to connect seeds the shared menu & settings from this device
    db.ref("pos/settings").once("value").then(s=>{ if(!s.exists()){ commitSettings(); db.ref("pos/nextNo").set(S.settings.nextNo||1001); } });
    db.ref("pos/settings").on("value",s=>{ if(s.exists()){ S.settings=defaults({settings:s.val()}).settings; refresh(); } });
    db.ref("pos/menuText").on("value",s=>{ if(s.exists()){ S.menuText=s.val(); refresh(); } });
    db.ref("pos/tables").on("value",s=>{
      const v=s.val()||{}; const keep=cur&&S.tables[cur]&&!S.tables[cur].items.length?S.tables[cur]:null;
      S.tables={}; Object.keys(v).forEach(k=>S.tables[k]=normTable(v[k]));
      if(keep&&!S.tables[cur])S.tables[cur]=keep;
      refresh();
    });
  });
}
function loginScreen(mode){
  const create=mode==="create";
  modal(`<h3>두꺼비집 POS ${create?"비밀번호 만들기":"로그인"}</h3>
   <p class="hint">${create?"가게 POS 비밀번호를 처음 한 번만 정합니다. 6자 이상으로 정해 주세요.":"이 기기에서 처음 한 번만 로그인하면 됩니다. 가게의 다른 기기들과 주문이 공유됩니다."}</p>
   <label class="hint">이메일<input id="lgE" type="email" value="${SHOP_EMAIL}" autocomplete="username" ${create?"readonly":""}></label>
   <label class="hint">비밀번호<input id="lgP" type="password" autocomplete="${create?"new-password":"current-password"}"></label>
   ${create?'<label class="hint">비밀번호 확인<input id="lgP2" type="password" autocomplete="new-password"></label>':""}
   <p class="hint" id="lgErr" style="color:var(--danger)"></p>
   <div class="row">${create?'<button id="lgBack">로그인으로</button>':'<button class="ghost" id="lgNew">처음 설정: 비밀번호 만들기</button>'}<button class="primary" id="lgGo">${create?"만들고 시작":"로그인"}</button></div>`, true);
  const err=t=>$("lgErr").textContent=t;
  const msg=e=>{const c=e.code||"";
    if(/network/i.test(c))return "인터넷 연결을 확인해 주세요.";
    if(/email-already-in-use/.test(c))return "이미 비밀번호가 만들어져 있습니다. 로그인으로 돌아가 주세요.";
    if(/weak-password/.test(c))return "비밀번호는 6자 이상이어야 합니다.";
    if(/too-many-requests/.test(c))return "시도가 너무 많습니다. 잠시 후 다시 해주세요.";
    return create?"만들 수 없습니다: "+c:"이메일 또는 비밀번호가 맞지 않습니다.";};
  const go=()=>{ err("");
    const e=$("lgE").value.trim(), pw=$("lgP").value;
    if(create){ if(pw.length<6)return err("비밀번호는 6자 이상이어야 합니다."); if(pw!==$("lgP2").value)return err("두 비밀번호가 다릅니다.");
      firebase.auth().createUserWithEmailAndPassword(SHOP_EMAIL,pw).catch(x=>err(msg(x))); }
    else firebase.auth().signInWithEmailAndPassword(e,pw).catch(x=>err(msg(x))); };
  $("lgGo").onclick=go; $("lgP").onkeydown=e=>{if(e.key==="Enter"&&!create)go()};
  if(create)$("lgBack").onclick=()=>loginScreen(); else $("lgNew").onclick=()=>loginScreen("create");
}

const menu=()=>S.menuText.split("\n").map(l=>l.trim()).filter(l=>l&&!l.startsWith("#")).map((l,i)=>{const[c,n,p,e,z]=l.split("|").map(x=>(x||"").trim());return{id:i,cat:c||"기타",name:n||c,price:parseFloat(p)||0,en:e||"",zh:z||zhOf(n||c)}});

// 서비스(무료) 품목: 손님 금액은 $0, 세금은 원래 가격 기준으로 계산
function calc(t){const it=t?.items||[];const sub=it.reduce((a,x)=>a+lineAmt(x),0);const svc=it.reduce((a,x)=>a+(x.svc?x.price*x.qty:0),0);const tax=Math.round((sub+svc)*S.settings.tax)/100;return{sub,svc,tax,total:sub+tax}}
function toggleSvc(t,i){
  const x=t.items[i]; const want=!x.svc;
  let y=t.items.find((z,j)=>j!==i&&z.name===x.name&&z.price===x.price&&!z.note&&!x.note&&!!z.svc===want);
  if(!y){ if(x.qty===1){ x.svc=want; return; } y={...x,qty:0,sent:0,svc:want}; t.items.splice(i+1,0,y); }
  x.qty--; y.qty++; if(x.sent>x.qty){x.sent--; y.sent++;}
  if(x.qty<=0) t.items.splice(t.items.indexOf(x),1);
}

let cur=null, curCat=null;

function renderFloor(){
  const f=$("floor"); f.innerHTML="";
  const add=(h)=>{const d=document.createElement("div");d.className="sect";d.textContent=h;f.appendChild(d)};
  add("홀 테이블");
  tableIds().forEach(id=>{
    if(id==="TO1")add("투고 / 픽업");
    const t=S.tables[id]; const busy=t&&t.items.length;
    const b=document.createElement("button"); b.className="tbl"+(busy?" busy":"");
    const unsent=busy?t.items.filter(x=>x.qty>x.sent).length:0;
    b.innerHTML=`<span class="name">${id.startsWith("TO")?"투고 "+id.slice(2):id.slice(1)}</span>
      <span class="meta">${busy?timeStr(t.opened)+" 시작 · "+t.items.reduce((a,x)=>a+x.qty,0)+"개":"비어있음"}${unsent?' · <b style="color:var(--busy)">미전송 '+unsent+'</b>':""}</span>
      ${busy?`<span class="amt num">${money(calc(t).total)}</span>`:""}`;
    b.onclick=()=>openTable(id); f.appendChild(b);
  });
}
function openTable(id){
  cur=id; if(!S.tables[id])S.tables[id]={items:[],opened:Date.now()};
  $("floor").hidden=true; $("order").hidden=false; renderOrder();
}
function back(){
  const t=S.tables[cur]; if(t&&!t.items.length)delete S.tables[cur];
  if(!CLOUD)saveLocal(); cur=null; $("order").hidden=true; $("floor").hidden=false; renderFloor();
}
function renderOrder(){
  const m=menu(); const cats=[...new Set(m.map(x=>x.cat))];
  if(!cats.includes(curCat))curCat=cats[0];
  $("cats").innerHTML=""; cats.forEach(c=>{const b=document.createElement("button");b.innerHTML=esc(c)+(CAT_EN[c]?`<em class="en">${CAT_EN[c]}</em>`:"");if(c===curCat)b.className="on";b.onclick=()=>{curCat=c;renderOrder()};$("cats").appendChild(b)});
  $("items").innerHTML=""; m.filter(x=>x.cat===curCat).forEach(x=>{const b=document.createElement("button");b.className="mi";b.innerHTML=`<b>${esc(x.name)}</b>${x.en?`<em class="en">${esc(x.en)}</em>`:""}<span class="num">${money(x.price)}</span>`;b.onclick=()=>addItem(x);$("items").appendChild(b)});
  const t=S.tables[cur]; t.items.forEach(x=>{if(!x.en){const f=m.find(y=>y.name===x.name);if(f)x.en=f.en}}); $("ttl").textContent=label(cur); $("opened").textContent=timeStr(t.opened)+" 시작";
  const L=$("lines"); L.innerHTML="";
  if(!t.items.length)L.innerHTML='<div class="empty">왼쪽 메뉴를 눌러 주문을 추가하세요.</div>';
  t.items.forEach((x,i)=>{
    const d=document.createElement("div"); d.className="ln";
    const st=x.qty>x.sent?`<span class="pill new">주방 미전송 ${x.qty-x.sent}</span>`:`<span class="pill sent">전송됨</span>`;
    d.innerHTML=`<span class="nm">${esc(x.name)} × <span class="num">${x.qty}</span>${x.en?`<em class="en">${esc(x.en)}</em>`:""}</span><span class="pr num">${x.svc?`<s class="was">${money(x.price*x.qty)}</s> `:""}${money(lineAmt(x))}</span>
      ${x.note?`<span class="note">↳ ${esc(x.note)}</span>`:""}
      <span class="ctl"><button data-a="m">−</button><button data-a="p">+</button><button data-a="n">메모</button><button data-a="s" class="${x.svc?"svcOn":""}">${x.svc?"서비스 취소":"서비스"}</button><span class="spacer"></span>${x.svc?`<span class="pill svc">서비스 $0</span>`:""}${st}</span>`;
    d.querySelector('[data-a=m]').onclick=()=>{x.qty--; if(x.qty<x.sent)x.sent=x.qty; if(x.qty<=0)t.items.splice(i,1); commitTable(cur); renderOrder()};
    d.querySelector('[data-a=p]').onclick=()=>{x.qty++; commitTable(cur); renderOrder()};
    d.querySelector('[data-a=n]').onclick=()=>noteModal(i);
    d.querySelector('[data-a=s]').onclick=()=>{toggleSvc(t,i); commitTable(cur); renderOrder()};
    L.appendChild(d);
  });
  const c=calc(t); $("sub").textContent=money(c.sub); $("tax").textContent=money(c.tax); $("taxLbl").textContent=`(${S.settings.tax}%)`; $("total").textContent=money(c.total);
  $("btnKitchen").disabled=!t.items.some(x=>x.qty>x.sent);
}
function addItem(m){
  const t=S.tables[cur]; const ex=t.items.find(x=>x.id===m.id&&x.name===m.name&&!x.note&&!x.svc);
  if(ex)ex.qty++; else t.items.push({id:m.id,name:m.name,en:m.en||"",zh:m.zh||"",price:m.price,qty:1,sent:0,note:""});
  commitTable(cur); renderOrder();
}

function confirmBox(msg,ok){modal(`<h3>${msg}</h3><div class="row"><button id="mNo">아니요</button><button class="primary" id="mYes">예</button></div>`);$("mNo").onclick=closeModal;$("mYes").onclick=()=>{closeModal();ok()}}
function noteModal(i){
  const x=S.tables[cur].items[i]; if(!x)return;
  modal(`<h3>${esc(x.name)} 메모 (주방에 출력됨)</h3><input id="mNote" value="${esc(x.note)}" placeholder="예: 덜 맵게, 계란 추가"><div class="row"><button id="mNo">취소</button><button class="primary" id="mYes">저장</button></div>`);
  $("mNote").focus(); $("mNo").onclick=closeModal;
  $("mYes").onclick=()=>{const t=S.tables[cur]; const y=t&&t.items.find(z=>z.name===x.name&&z.id===x.id&&z.note===x.note)||t&&t.items[i]; const v=$("mNote").value.trim();
    if(y&&v!==y.note){y.note=v; y.sent=0;} commitTable(cur); closeModal(); renderOrder()};
}

function docToPNG(doc){
  const W=576, P=6, cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const font=o=>`${o.b?"700":"400"} ${o.s}px ${TK_FONT}`;
  const wrap=(text,maxW)=>{ const out=[]; let line="";
    for(const ch of String(text)){ const tryL=line+ch; if(ctx.measureText(tryL).width>maxW&&line){ out.push(line); line=ch.trimStart(); } else line=tryL; }
    if(line||!out.length)out.push(line); return out; };
  // layout
  const ops=[]; let y=P, wmTop=-1;
  doc.forEach(o=>{
    if(o.hr){ ops.push({hr:1,y:y+10}); y+=22; return; }
    if(o.logo){ ops.push({logo:1,y:y+4,size:o.size}); y+=Math.round(o.size*LOGO_AR)+12; if(o.wm)wmTop=y; return; }
    y+=o.gap||0; ctx.font=font(o); const lh=Math.round(o.s*1.28);
    if(o.l!==undefined){ const rw=ctx.measureText(o.r).width; const ls=wrap(o.l,W-2*P-rw-16);
      ls.forEach((ln,i)=>{ ops.push({o,x:P,y,txt:ln,al:"left"}); if(i===0)ops.push({o,x:W-P,y,txt:o.r,al:"right"}); y+=lh; }); return; }
    const ind=o.ind||0; wrap(o.t,W-2*P-ind).forEach(ln=>{ ops.push({o,x:o.a==="c"?W/2:P+ind,y,txt:ln,al:o.a==="c"?"center":"left"}); y+=lh; });
  });
  cv.width=W; cv.height=Math.ceil(y+30);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle="#000"; ctx.textBaseline="top";
  ops.forEach(op=>{ if(op.logo){ drawBadge(ctx,(W-op.size)/2,op.y,op.size); return; } if(op.hr){ for(let x=P;x<W-P;x+=12)ctx.fillRect(x,op.y,7,2); return; }
    ctx.font=font(op.o); ctx.textAlign=op.al; ctx.fillText(op.txt,op.x,op.y); });
  const im=ctx.getImageData(0,0,cv.width,cv.height), px=im.data;
  for(let i=0;i<px.length;i+=4){ const v=(px[i]+px[i+1]+px[i+2])/3<150?0:255; px[i]=px[i+1]=px[i+2]=v; px[i+3]=255; }
  if(wmTop>=0){ // faint emblem behind the text: sparse dots so a 1-bit thermal printer prints it as light gray
    const sz=Math.min(W-40,440), wy=Math.round(Math.max(wmTop, wmTop+(cv.height-30-wmTop-sz*LOGO_AR)/2));
    const wc=document.createElement("canvas"); wc.width=sz; wc.height=sz; const wx=wc.getContext("2d");
    wx.fillStyle="#fff"; wx.fillRect(0,0,sz,sz); drawBadge(wx,0,0,sz);
    const wd=wx.getImageData(0,0,sz,sz).data, ox=Math.round((W-sz)/2);
    for(let yy=0;yy<sz;yy++){ const Y=wy+yy; if(Y<0||Y>=cv.height)continue;
      for(let xx=0;xx<sz;xx++){ if((xx+yy)%3||yy%2)continue; const k=(yy*sz+xx)*4; if(wd[k]>=150)continue;
        const i=(Y*W+ox+xx)*4; if(px[i]===255){ px[i]=px[i+1]=px[i+2]=0; } } } }
  ctx.putImageData(im,0,0);
  return cv.toDataURL("image/png").split(",")[1];
}
const useCloudPrint=()=>CLOUD&&db&&(S.settings.printMode||"cloud")==="cloud";
function toast(msg,bad){ let el=$("toast"); if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}
  el.textContent=msg; el.className="toast"+(bad?" bad":""); el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function sendPrint(doc,html,kind,id){
  if(!useCloudPrint()){ doPrint(html); return; }
  let png; try{ png=docToPNG(doc); }catch(e){ doPrint(html); return; }
  db.ref("pos/printQueue").push({png,kind,table:id,created:Date.now()})
    .then(()=>{ if(printerOnline())toast(kind==="kitchen"?"주방 프린터로 보냈습니다":"영수증을 프린터로 보냈습니다");
      else toast("프린터가 꺼져 있는 것 같습니다. 켜지면 자동으로 출력됩니다.",true); })
    .catch(()=>{ toast("프린터로 보내지 못했습니다. 인쇄 창으로 출력합니다.",true); doPrint(html); });
}

let RP={mode:"day",anchor:null};
function periodRange(mode,anchor){
  const a=new Date(anchor); a.setHours(0,0,0,0); let b;
  if(mode==="week"){ const dow=(a.getDay()+6)%7; a.setDate(a.getDate()-dow); b=new Date(a); b.setDate(b.getDate()+7); }
  else if(mode==="month"){ a.setDate(1); b=new Date(a); b.setMonth(b.getMonth()+1); }
  else { b=new Date(a); b.setDate(b.getDate()+1); }
  return [a,b];
}
function periodLabel(mode,a,b){
  const f=d=>d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});
  if(mode==="month")return a.toLocaleDateString("ko-KR",{year:"numeric",month:"long"});
  if(mode==="week"){const e=new Date(b);e.setDate(e.getDate()-1);return f(a)+" – "+f(e);}
  return a.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
}
async function showReport(){

  try{ list=(await salesBetween(a.getTime(),b.getTime())).sort((x,y)=>x.time-y.time); }
  catch(e){ modal(`<h3>매출 보기</h3><p class="hint" style="color:var(--danger)">매출을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.</p><div class="row"><button id="mNo">닫기</button></div>`); $("mNo").onclick=closeModal; return; }
  const sum=k=>list.reduce((t,x)=>t+(x[k]||0),0);
  const by=m=>list.filter(x=>x.method===m).reduce((t,x)=>t+x.total,0);
  // menu breakdown
  const cats=menu().map(x=>x.cat); const catOrder=[...new Set(cats)];
  const agg={};
  list.forEach(sale=>(sale.items||[]).forEach(it=>{
    const c=it.c||(menu().find(y=>y.name===it.n)||{}).cat||"기타";
    const k=c+"|"+it.n; agg[k]=agg[k]||{c,n:it.n,q:0,amt:0}; agg[k].q+=it.q; agg[k].amt+=it.q*it.p;
  }));
  const rows=Object.values(agg);
  const groups=[...catOrder,...new Set(rows.map(r=>r.c).filter(c=>!catOrder.includes(c)))].map(c=>{
    const rs=rows.filter(r=>r.c===c).sort((x,y)=>y.q-x.q||y.amt-x.amt);
    return {c,rs,q:rs.reduce((t,r)=>t+r.q,0),amt:rs.reduce((t,r)=>t+r.amt,0)};
  }).filter(g=>g.rs.length);
  const top=rows.slice().sort((x,y)=>y.q-x.q).slice(0,3);

      <div class="sub">${(x.items||[]).map(i=>esc(i.n)+" ×"+i.q).join(", ")}</div></td><td>${money(x.total)}</td></tr>`).join("")}</table>`:"<p class='hint'>결제된 건이 없습니다.</p>";
  modal(`<h3>매출 보기</h3>
   <div class="seg">${[["day","하루"],["week","주"],["month","월"]].map(([m,l])=>`<button data-m="${m}" class="${RP.mode===m?"on":""}">${l}</button>`).join("")}
     <span class="spacer"></span><button id="rpPrev">◀</button><button id="rpToday">오늘</button><button id="rpNext">▶</button></div>
   <h4>${periodLabel(RP.mode,a,b)}</h4>
   <div class="kpis">
     <div class="kpi"><span>합계 (세금 포함)</span><b class="num">${money(sum("total"))}</b></div>
     <div class="kpi"><span>매출 (세전)</span><b class="num">${money(sum("sub"))}</b></div>
     <div class="kpi"><span>결제 건수</span><b class="num">${list.length}</b></div>
     <div class="kpi"><span>평균 결제액</span><b class="num">${money(list.length?sum("total")/list.length:0)}</b></div>
   </div>
   <table class="rep num"><tr><td>카드</td><td>${money(by("카드"))}</td></tr><tr><td>현금</td><td>${money(by("현금"))}</td></tr><tr><td>세금</td><td>${money(sum("tax"))}</td></tr></table>

  $("mNo").onclick=closeModal;
  document.querySelectorAll(".seg [data-m]").forEach(btn=>btn.onclick=()=>{RP.mode=btn.dataset.m;showReport()});
  const shift=n=>{const d=new Date(RP.anchor); if(RP.mode==="month")d.setMonth(d.getMonth()+n); else d.setDate(d.getDate()+(RP.mode==="week"?7:1)*n); RP.anchor=d.getTime(); showReport();};
  $("rpPrev").onclick=()=>shift(-1); $("rpNext").onclick=()=>shift(1); $("rpToday").onclick=()=>{RP.anchor=Date.now();showReport()};
}
$("btnSales").onclick=()=>{RP.anchor=Date.now();showReport()};

setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),1000);
$("clock").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
renderFloor();
if(CLOUD)startCloud(); else if(FB_CONFIG){const e=$("sync");e.hidden=false;e.className="sync off";e.textContent="● 공유 연결 안 됨 (새로고침)";}
</script>
